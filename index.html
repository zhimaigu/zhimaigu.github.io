*{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}a:focus-visible{outline:3px solid var(--blue);outline-offset:7px}a:hover{color:var(--blue)}.page{max-width:1120px;margin:auto;padding:0 48px;min-height:100svh;display:flex;flex-direction:column}header{padding:30px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:24px}.brand{font-weight:700;font-size:20px;letter-spacing:-.5px}.brand span{color:var(--blue)}.profile{font-size:14px;color:var(--muted)}main{flex:1;display:grid;grid-template-columns:1.4fr 1fr;align-items:center;gap:64px;padding:80px 0 100px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:13px;font-weight:600;color:var(--blue);margin:0 0 28px}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(64px,8vw,104px);font-weight:400;line-height:1.05;letter-spacing:-.055em;margin:0 0 32px}h1 span{display:block}.intro{font-size:20px;line-height:1.7;color:var(--muted);max-width:390px;margin:0 0 12px}.chinese{font-size:16px;color:var(--muted);margin:0}.button{display:inline-flex;align-items:center;gap:28px;background:var(--blue);color:#fff;padding:14px 22px;border-radius:4px;margin-top:36px;font-size:16px;font-weight:500}.button:hover{background:#1745b0;color:#fff}.identity{background:#e7eef8;border:1px solid #d4dfee;border-radius:6px;aspect-ratio:4/5;min-height:350px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;position:relative}.card-top{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#415b78;display:flex;justify-content:space-between;gap:16px}.initials{font-family:Georgia,"Times New Roman",serif;font-size:clamp(90px,12vw,154px);line-height:1;color:#244b80;letter-spacing:-.08em;text-align:center;padding:38px 0}.card-bottom{border-top:1px solid #bdcde0;padding-top:20px}.card-name{font-size:20px;font-weight:600;margin:0}.handle{font-size:14px;color:#415b78;margin:4px 0 0}footer{border-top:1px solid var(--line);padding:24px 0;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:14px}footer p{margin:0}@media(max-width:720px){.page{padding:0 24px}header{padding:22px 0}.profile{font-size:13px}main{grid-template-columns:1fr;gap:44px;padding:56px 0}h1 span{display:inline}h1 span+span:before{content:" "}h1{font-size:64px}.intro{font-size:18px}.identity{aspect-ratio:auto;min-height:290px}.initials{font-size:112px;padding:28px 0}footer{flex-wrap:wrap;font-size:13px}}@media(prefers-reduced-motion:no-preference){a{transition:color .15s,background .15s}}
